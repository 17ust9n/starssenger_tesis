{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starssenger</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>

  <!-- Carga de Scripts JS de Starssenger -->
  <script src="{% static 'js/00-logo.js' %}"></script>
  <script src="{% static 'js/01-protocolo-keystream.js' %}"></script>
  <script src="{% static 'js/02-protocolo-x25519.js' %}"></script>
  <script src="{% static 'js/03-estado.js' %}"></script>
  <script src="{% static 'js/04-helpers.js' %}"></script>

  <script>
    // Inyección de variables globales desde Django hacia JS
    const LOGO = "data:image/svg+xml;base64,..."; // Definido en 00-logo.js o inyectado aquí
    const DJANGO_USER = {
      isAuth: {{ user.is_authenticated|yesno:"true,false" }},
      phone: "{{ request.user.usuario.dni|default:'' }}",
      name: "{{ request.user.usuario.nombre|default:'' }}"
    };

    // Inicialización al cargar el DOM (Equivalente al boot() original)
    document.addEventListener("DOMContentLoaded", function() {
      // Seteo de logos en cabeceras presentes
      const lg1 = document.getElementById('lg1');
      const lg2 = document.getElementById('lg2');
      if (lg1) lg1.src = LOGO;
      if (lg2) lg2.src = LOGO;

      {% if user.is_authenticated %}
        // Usuario autenticado: reconstruir conversaciones e iniciar red MQTT/WebSocket
        if (typeof rebuildConvs === 'function') rebuildConvs();
        if (typeof startNet === 'function' && !window.client) {
          startNet();
        } else if (window.client && window.topicMap) {
          Object.keys(topicMap).forEach(t => client.subscribe(t));
        }
        if (typeof renderList === 'function') renderList();
        if (typeof processAddLink === 'function') processAddLink();
      {% endif %}
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
